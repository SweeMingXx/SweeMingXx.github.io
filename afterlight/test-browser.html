<!doctype html><html lang="en"><meta charset="utf-8"><title>Afterlight browser QA</title><body><pre id="status">RUNNING</pre><iframe title="Mobile test" id="app" src="./" style="width:390px;height:844px;border:0"></iframe><script>
const frame=document.getElementById('app'),out=document.getElementById('status');const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,m)=>{if(!v)throw Error(m)};const logs=[];
frame.onload=async()=>{try{const w=frame.contentWindow,d=w.document,$=s=>d.querySelector(s);const errors=[];w.addEventListener('error',e=>errors.push(e.message));await wait(250);assert(w.Afterlight,'Engine loaded');assert($('#start'),'Start control');assert(d.documentElement.scrollWidth<=390,'No horizontal overflow at 390px');assert($('#start').getBoundingClientRect().height>=44,'Touch target at least 44px');assert($('#start').getBoundingClientRect().bottom<=$('#arena').getBoundingClientRect().bottom,'Start fits arena');logs.push('390px mobile layout');$('[data-mode="daily"]').click();assert($('#mode-label').textContent.startsWith('DAILY'),'Daily selection');$('[data-mode="zen"]').click();$('#start').click();assert($('#welcome').classList.contains('hidden'),'Game starts');assert(!$('#pause').disabled,'Pause enabled');assert($('#hearts').textContent==='∞','Zen has no damage');w.document.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(350);w.document.dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));assert(Number($('#clock').textContent)<60,'Simulation advances');$('#pause').click();assert($('#pause-dialog').open,'Pause dialog');const clock=$('#clock').textContent;await wait(200);assert($('#clock').textContent===clock,'Pause freezes time');$('#resume').click();assert(!$('#pause-dialog').open,'Resume closes dialog');$('#help').click();assert($('#help-dialog').open,'Help opens');$('[data-close="help-dialog"]').click();await wait(50);$('#pause').click();$('#quit').click();assert(!$('#result').classList.contains('hidden'),'Result visible');assert($('#result-label').textContent==='TRANSMISSION ENDED','Abandoned run identified');$('#share').click();assert($('#share-text').value.includes('?seed='),'Seeded share link');$('[data-close="share-dialog"]').click();$('#home').click();assert(!$('#welcome').classList.contains('hidden'),'Return home');$('#motion').click();assert($('#motion').getAttribute('aria-pressed')==='true','Reduced effects');logs.push('daily / zen / keyboard / pause / help / result / share / home / reduced effects');frame.style.width='320px';frame.style.height='568px';await wait(200);assert(d.documentElement.scrollWidth<=320,'No horizontal overflow at 320px');assert($('#start').getBoundingClientRect().bottom<=$('#arena').getBoundingClientRect().bottom,'Small-phone start fits');logs.push('320px mobile layout');frame.style.width='1440px';frame.style.height='1000px';await wait(200);assert(d.documentElement.scrollWidth<=1440,'No desktop horizontal overflow');assert(w.getComputedStyle($('.editorial')).display!=='none','Desktop editorial visible');assert(w.getComputedStyle($('.field-notes')).display!=='none','Desktop notes visible');assert(errors.length===0,'No runtime errors: '+errors.join(';'));logs.push('1440px desktop layout / no runtime errors');out.textContent='BROWSER_'+'TESTS_PASSED\n'+logs.join('\n')}catch(e){out.textContent='FAILED: '+e.stack}};
</script></body></html>
