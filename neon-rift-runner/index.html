<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Rift Runner</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050816;color:#eaf7ff;font-family:Inter,system-ui,sans-serif}#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;justify-content:space-between;align-items:flex-start}.p{background:#050c1ebb;border:1px solid #64dcff47;backdrop-filter:blur(10px);border-radius:16px;padding:12px 15px}.b{font-size:26px;font-weight:800}.m{color:#91a9bd;font-size:12px}#center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}#start{pointer-events:auto;text-align:center;max-width:460px}h1{font-size:clamp(38px,7vw,72px);margin:0 0 6px;line-height:.9;letter-spacing:-.06em}#start p{color:#9fb5c8;margin:10px 0 20px}button{border:0;border-radius:12px;padding:12px 20px;font-weight:800;background:#7de7ff;color:#031018;cursor:pointer}#tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#89a1b5}#mobile{display:none;position:fixed;inset:auto 0 22px;justify-content:center;gap:18px}#mobile button{width:64px;height:54px;font-size:20px;background:#7de7ffdd}@media(max-width:700px){#mobile{display:flex}#tip{bottom:92px}.p{padding:9px 11px}.b{font-size:21px}}</style></head><body><div id="hud"><div class="p"><div class="m">RIFT ENERGY</div><div id="score" class="b">000000</div></div><div class="p" style="text-align:right"><div class="m">SPEED</div><div id="speed" class="b">0</div></div></div><div id="center"><div id="start" class="p"><div class="m">3D MICRO-GAME / 01</div><h1>NEON<br>RIFT RUNNER</h1><p>Thread the unstable rift. Grab energy shards. Dodge the void sentinels. How long can you survive?</p><button id="play">ENTER THE RIFT</button><div class="m" style="margin-top:12px">A / D or ← / → to steer · Space to phase-dash</div></div></div><div id="tip">COLLECT ◆ SHARDS · AVOID ● SENTINELS · SPACE = PHASE DASH</div><div id="mobile"><button id="left">◀</button><button id="dash">◆</button><button id="right">▶</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as THREE from "three";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050816);scene.fog=new THREE.FogExp2(0x050816,.018);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);camera.position.set(0,5.5,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8de9ff,0x09091a,1.7));const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(5,10,4);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x071021,metalness:.65,roughness:.5}));floor.rotation.x=-Math.PI/2;floor.position.y=-1;scene.add(floor);
const grid=new THREE.GridHelper(150,60,0x1b6b86,0x0c2a3a);grid.position.y=-.98;scene.add(grid);
const mat=(c,e=2)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,metalness:.35,roughness:.25});
const ship=new THREE.Group();ship.position.set(0,0,2);scene.add(ship);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.6,6,12),mat(0x4ce9ff,1.5));body.rotation.x=Math.PI/2;ship.add(body);
const wing=new THREE.Mesh(new THREE.BoxGeometry(2.1,.12,.65),mat(0x9b7bff,2));ship.add(wing);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.26,1),mat(0xffffff,4));core.position.z=-.18;ship.add(core);
const rings=[];for(let i=0;i<24;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(7.5,.035,6,64),new THREE.MeshBasicMaterial({color:i%2?0x5d8dff:0x20e0d0,transparent:true,opacity:.25}));r.rotation.x=Math.PI/2;r.position.y=-.88;r.position.z=-i*7;scene.add(r);rings.push(r)}
const stars=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0x8bdcff,size:.08}));const pts=[];for(let i=0;i<900;i++)pts.push((Math.random()-.5)*100,Math.random()*45-5,-Math.random()*180);stars.geometry.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));scene.add(stars);
const shards=[],hazards=[];function spawnShard(z){let o=new THREE.Mesh(new THREE.OctahedronGeometry(.45),mat(0x42ffe1,3));o.position.set((Math.random()*2-1)*5.7,.15,z);o.userData.spin=.04;scene.add(o);shards.push(o)}function spawnHazard(z){let o=new THREE.Mesh(new THREE.IcosahedronGeometry(.72,1),mat(0xff4d91,2.5));o.position.set((Math.random()*2-1)*5.7,.1,z);o.userData.spin=.02;scene.add(o);hazards.push(o)}for(let i=0;i<8;i++)spawnShard(-30-i*13-Math.random()*30);for(let i=0;i<6;i++)spawnHazard(-48-i*17-Math.random()*40);
let playing=false,score=0,speed=0,phase=0,lane=0,targetLane=0;const keys={};
addEventListener("keydown",e=>{let k=e.key.toLowerCase();keys[k]=true;if([" ","arrowleft","arrowright"].includes(k))e.preventDefault();if(k===" "&&playing&&phase<=0)phase=.75});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function steer(d){targetLane=Math.max(-1,Math.min(1,targetLane+d))}left.onclick=()=>steer(-1);right.onclick=()=>steer(1);dash.onclick=()=>{if(playing&&phase<=0)phase=.75};
function reset(){shards.forEach((o,i)=>{o.position.z=-30-i*13-Math.random()*30;o.position.x=(Math.random()*2-1)*5.7});hazards.forEach((o,i)=>{o.position.z=-48-i*17-Math.random()*40;o.position.x=(Math.random()*2-1)*5.7})}
function startGame(){playing=true;score=0;speed=18;phase=0;targetLane=0;lane=0;ship.position.set(0,0,2);reset();start.style.display="none"}
function endGame(){playing=false;start.style.display="block";start.innerHTML='<div class="m">RIFT COLLAPSED</div><h1>'+String(Math.floor(score)).padStart(6,"0")+'</h1><p>You survived the void. Run it back and beat your score.</p><button id="play">RE-ENTER THE RIFT</button><div class="m" style="margin-top:12px">A / D or ← / → · Space to phase-dash</div>';play.onclick=startGame}
play.onclick=startGame;
const hit=(a,b)=>a.position.distanceTo(b.position)<1.25;let last=performance.now();
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000,.033);last=t;if(playing){if(keys.a||keys.arrowleft){steer(-1);keys.a=keys.arrowleft=false}if(keys.d||keys.arrowright){steer(1);keys.d=keys.arrowright=false}if(keys[" "]&&phase<=0){phase=.75;keys[" "]=false}speed=Math.min(46,speed+dt*1.4);score+=dt*speed*.9;lane+=(targetLane-lane)*Math.min(1,dt*8);ship.position.x=lane*5.3;ship.position.y=Math.sin(t*.004)*.12;ship.rotation.z=(targetLane-lane)*-.18;phase=Math.max(0,phase-dt);ship.scale.setScalar(phase>0?1.22:1);
[...shards,...hazards].forEach(o=>{o.position.z+=speed*dt;o.rotation.x+=o.userData.spin;o.rotation.y+=o.userData.spin*1.4});
shards.forEach(o=>{if(o.position.z>8){o.position.z=-75-Math.random()*55;o.position.x=(Math.random()*2-1)*5.7}if(hit(ship,o)){score+=125;o.position.z=-85-Math.random()*50;o.position.x=(Math.random()*2-1)*5.7}});
hazards.forEach(o=>{if(o.position.z>8){o.position.z=-85-Math.random()*70;o.position.x=(Math.random()*2-1)*5.7}if(hit(ship,o)&&phase<=0)endGame()});
rings.forEach(r=>{r.position.z+=speed*dt;if(r.position.z>12)r.position.z=-150});stars.position.z+=speed*dt*.25;if(stars.position.z>20)stars.position.z=0;scoreEl.textContent=String(Math.floor(score)).padStart(6,"0");speedEl.textContent=Math.floor(speed*4)+" km/h"}
camera.position.x+=(ship.position.x*.16-camera.position.x)*.05;camera.lookAt(ship.position.x*.18,0,-12);renderer.render(scene,camera)}animate(0);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
