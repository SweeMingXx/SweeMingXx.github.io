name: SPECTRA focused source refinement
on:
  push:
    paths: ['.github/workflows/spectra-refinement.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            async function edit(path, transform) {
              const {data} = await github.rest.repos.getContent({...context.repo,path,ref:'main'});
              const before = Buffer.from(data.content,'base64').toString('utf8');
              const after = transform(before);
              if (after === before) return;
              await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha:data.sha,message:'fix(spectra): refine state restoration and accessible interactions',content:Buffer.from(after).toString('base64')});
            }
            await edit('spectra/app.js', source => {
              let out = source;
              if (out.includes('function description(){')) {
                const start = out.indexOf('function description(){');
                const end = out.indexOf('function updateDescription()',start);
                if (end < 0) throw new Error('Description boundary not found');
                const revised = out.slice(start,end).replace(/\bstate\b/g,'s').replace('function description(){','function description(s=state){').replace('motionName()','motionName(s)');
                out = out.slice(0,start)+revised+out.slice(end);
              }
              if (out.includes('function motionName(){')) {
                const start=out.indexOf('function motionName(){'),end=out.indexOf('function description(',start);
                const revised=out.slice(start,end).replace(/\bstate\b/g,'s').replace('function motionName(){','function motionName(s=state){');
                out=out.slice(0,start)+revised+out.slice(end);
              }
              out=out.replace('description:description()},null,2)','description:description(s)},null,2)');
              out=out.replace('function sync(){renderPalette();','function sync(){if(master&&audio)master.gain.setTargetAtTime(state.volume/100*.24,audio.currentTime,.05);renderPalette();');
              const marker="$('modal-close').onclick=closeModal;";
              if(!out.includes("e.key==='Escape'){e.preventDefault();closeModal();"))out=out.replace(marker,marker+"$('modal').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeModal();}});");
              return out;
            });
            await edit('spectra/test-browser.cjs', source => {
              const marker=" await check('Reset and deletion confirmation and cancellation'";
              const test=" await check('Saved project backups describe their own artwork',async()=>{await click('nav-collection');await js('document.querySelector(\"[data-backup]\").click()');const data=await js('window.__exports.at(-1).text().then(JSON.parse)');assert.equal(data.title,'QA — A feeling worth keeping');assert.ok(data.description.startsWith(data.title));await click('nav-studio');});\n";
              if(source.includes('Saved project backups describe their own artwork'))return source;
              if(!source.includes(marker))throw new Error('Test insertion boundary not found');
              return source.replace(marker,test+marker);
            });
            await edit('spectra/README.md', source => source.replace('`tests/spectra.test.mjs`','`spectra/test-browser.cjs`'));
            core.notice('SPECTRA_REFINEMENTS_PERSISTED');
