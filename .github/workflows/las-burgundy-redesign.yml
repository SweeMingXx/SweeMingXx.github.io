name: Activate LAS burgundy redesign
on:
  push:
    branches: [main]
    paths:
      - 'las-conference-2026/tests/activate-theme.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: activate-las-redesign
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply burgundy theme to live entry point, artwork and live asset verification
        working-directory: las-conference-2026
        run: node tests/activate-theme.mjs
      - name: Persist site redesign to GitHub Pages source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add las-conference-2026/index.html las-conference-2026/favicon.svg las-conference-2026/tests/live.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Apply burgundy gradient design to LAS conference'
            git pull --rebase origin main
            git push origin main
          fi
