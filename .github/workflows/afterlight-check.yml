name: AFTERLIGHT quality checks
on:
  push:
    paths: ['afterlight/**', '.github/workflows/afterlight-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine and syntax
        run: |
          node --check afterlight/core.js
          node --check afterlight/game.js
          node --check afterlight/sw.js
          node afterlight/test-core.cjs > /tmp/afterlight-engine.log 2>&1 || { cat /tmp/afterlight-engine.log; echo "::error::$(tr '\n' ' ' < /tmp/afterlight-engine.log)"; exit 1; }
          cat /tmp/afterlight-engine.log
      - name: Mobile browser integration tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/afterlight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/afterlight/ >/dev/null && break; sleep 1; done
          node afterlight/test-chrome.cjs
      - name: Save responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-responsive-screenshots
          path: /tmp/afterlight-*.png
      - name: Confirm live GitHub Pages publication
        run: |
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 15 'https://sweemingxx.github.io/afterlight/' -o /tmp/afterlight-live.html && grep -q 'A GAME AGAINST YOURSELF' /tmp/afterlight-live.html; then
              echo '::notice::LIVE_SITE_VERIFIED https://sweemingxx.github.io/afterlight/'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Pages did not publish within the verification window'
          exit 1
