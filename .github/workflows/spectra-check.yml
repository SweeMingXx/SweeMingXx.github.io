name: SPECTRA browser and live-site verification
on:
  push:
    paths:
      - 'spectra/**'
      - '!spectra/verification.json'
      - '!spectra/preview.png'
      - '!spectra/preview.jpg'
      - '.github/workflows/spectra-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spectra-quality
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check spectra/app.js
          node --check spectra/test-browser.cjs
          node --check spectra/capture-preview.cjs
      - name: Test the real browser and live deployment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/spectra-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/spectra/ > /dev/null; then break; fi
            sleep 1
          done
          node spectra/test-browser.cjs
          node spectra/capture-preview.cjs
      - name: Retain browser screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-quality-evidence
          path: |
            /tmp/spectra-*.png
            /tmp/spectra-*.jpg
            /tmp/spectra-verification.json
      - name: Persist verification and studio preview
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            for (const [source, path] of [['/tmp/spectra-verification.json','spectra/verification.json'],['/tmp/spectra-preview.jpg','spectra/preview.jpg']]) {
              if (!fs.existsSync(source)) continue;
              let sha;
              try {
                const current = await github.rest.repos.getContent({...context.repo, path, ref:'main'});
                sha = current.data.sha;
              } catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch:'main', message:'test(spectra): persist release evidence [skip ci]', content:fs.readFileSync(source).toString('base64'), ...(sha?{sha}:{})});
            }
