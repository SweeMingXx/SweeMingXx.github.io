name: LAS conference — browser and live verification
on:
  push:
    branches: [main]
    paths:
      - 'las-conference-2026/**'
      - '.github/workflows/las-conference-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: las-conference-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared verification dependencies
        working-directory: las-conference-2026
        run: npm ci --no-audit --no-fund
      - name: Install test browser
        working-directory: las-conference-2026
        run: npx playwright install --with-deps chromium
      - name: Syntax checks
        working-directory: las-conference-2026
        run: |
          node --check app.js
          node --check data.js
          node --check tests/verify.mjs
          node --check tests/live.mjs
      - name: Browser, content, accessibility and live checks
        working-directory: las-conference-2026
        run: npm test
      - name: Verify exact deployed files and final official programme
        working-directory: las-conference-2026
        run: node tests/live.mjs
      - name: Persist verification evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d las-conference-2026/verification ]; then
            git add las-conference-2026/verification
            if ! git diff --cached --quiet; then
              git commit -m 'Record final LAS browser and deployed-asset verification [skip ci]'
              git pull --rebase origin main
              git push origin main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: las-conference-verification
          path: las-conference-2026/verification/
