name: LAS conference — browser and live verification
on:
  push:
    branches: [main]
    paths:
      - 'las-conference-2026/**'
      - '.github/workflows/las-conference-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: las-conference-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact source wording found in the source audit
        working-directory: las-conference-2026
        run: |
          python3 -c "from pathlib import Path; p=Path('reports/technology-panel.md'); s=p.read_text(); s=s.replace('qualify inspiration and serendipitous discovery within the AI box.', 'qualify inspiration and serendipity within the AI box.'); p.write_text(s)"
      - name: Install declared verification dependencies
        working-directory: las-conference-2026
        run: npm install --no-audit --no-fund
      - name: Install test browser
        working-directory: las-conference-2026
        run: npx playwright install --with-deps chromium
      - name: Syntax checks
        working-directory: las-conference-2026
        run: |
          node --check app.js
          node --check data.js
          node --check tests/verify.mjs
      - name: Browser, content, accessibility and live checks
        working-directory: las-conference-2026
        run: npm test
      - name: Persist verification evidence and audited source correction
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add las-conference-2026/verification las-conference-2026/reports/technology-panel.md las-conference-2026/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record LAS source correction and browser verification evidence [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: las-conference-verification
          path: las-conference-2026/verification/
