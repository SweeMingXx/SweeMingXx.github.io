name: Fix Beyond One Design Path cohort card
on:
  push:
    paths:
      - .github/workflows/fix-beyond-one-design-path.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply and validate page fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('beyond-one-design-path/index.html')
          s = p.read_text()
          substitutions = [
            ('      height: fit-content;\n      display: flex;\n      flex-direction: column;\n      gap: 1.5rem;\n    }\n\n    .toc-card {',
             '      height: fit-content;\n      max-height: calc(100vh - var(--header-height) - 3rem);\n      max-height: calc(100dvh - var(--header-height) - 3rem);\n      display: flex;\n      flex-direction: column;\n      gap: 1.5rem;\n    }\n\n    .toc-card {'),
            ('      backdrop-filter: blur(12px);\n    }\n\n    .toc-title {',
             '      backdrop-filter: blur(12px);\n      min-height: 0;\n      overflow-y: auto;\n    }\n\n    .toc-title {'),
            ('      box-shadow: var(--card-shadow);\n    }\n\n    .widget-badge {',
             '      box-shadow: var(--card-shadow);\n      flex-shrink: 0;\n    }\n\n    .widget-badge {'),
            ('      aside.nav-sidebar {\n        display: none;\n      }\n    }\n\n    @media (max-width: 640px) {',
             '      aside.nav-sidebar {\n        position: static;\n        max-height: none;\n      }\n      .toc-card {\n        display: none;\n      }\n    }\n\n    /* On short landscape screens, let the page scroll instead of clipping the card. */\n    @media (max-height: 480px) and (min-width: 993px) {\n      aside.nav-sidebar {\n        position: static;\n        max-height: none;\n      }\n      .toc-card {\n        overflow-y: visible;\n      }\n    }\n\n    @media (max-width: 640px) {'),
            ('Authored by <strong>SP User Experience Centre</strong>',
             'Hosted by <strong>SP User Experience Centre</strong>'),
          ]
          for old, new in substitutions:
              assert s.count(old) == 1, f'Unexpected source: {old[:60]}'
              s = s.replace(old, new)
          assert 'Hosted by <strong>SP User Experience Centre</strong>' in s
          assert 'aside.nav-sidebar {\n        display: none;' not in s
          p.write_text(s)
          PY
      - name: Commit page update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-beyond-one-design-path.yml
          git add beyond-one-design-path/index.html
          git commit -m 'Keep Next Cohort visible on small screens and update host credit'
          git push
